[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "enterprise-knowledge-engine"
version = "0.1.0"
description = "Tenant-scoped enterprise knowledge service foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2", "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3",
  "pypdf>=6,<8", "pgvector>=0.4,<1", "openai>=2,<3",
  "mcp[cli]==1.30.0", "anyio>=4.5,<5",
  "python-multipart>=0.0.20,<1", "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
security = ["pip-audit>=2.9,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_knowledge_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a migrated PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
