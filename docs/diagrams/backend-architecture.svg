<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="870" viewBox="0 0 1500 870" role="img" aria-labelledby="title desc"><title id="title">Enterprise Knowledge Engine backend architecture</title><desc id="desc">Clients call authenticated FastAPI routes. Shared ingestion, retrieval and grounded-answer services persist tenant-scoped knowledge in PostgreSQL with pgvector and full-text search. External providers supply embeddings, chat and optional reranking.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#85938a" stroke-width="1.5"/></marker><marker id="start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1L1 4L7 7" fill="none" stroke="#85938a" stroke-width="1.5"/></marker></defs><rect width="1500" height="870" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><rect x="24" y="24" width="1452" height="820" rx="18" fill="#fafbf9" stroke="#e8ece6" stroke-width="1.5"/><text x="65" y="74" fill="#c53d18" font-size="19" font-weight="600"><tspan x="65" dy="0">Enterprise Knowledge Engine</tspan></text><text x="65" y="125" fill="#24332b" font-size="36" font-weight="600"><tspan x="65" dy="0">Backend architecture</tspan></text><text x="65" y="158" fill="#66736a" font-size="18" font-weight="400"><tspan x="65" dy="0">One Python API. Shared services. Tenant-scoped knowledge.</tspan></text><rect x="65" y="255" width="215" height="130" rx="18" fill="#ffffff" stroke="#dce3dc" stroke-width="1.5"/><text x="85" y="299" fill="#24332b" font-size="23" font-weight="600"><tspan x="85" dy="0">Clients</tspan></text><text x="85" y="333" fill="#66736a" font-size="17" font-weight="400"><tspan x="85" dy="0">Next.js server proxy</tspan><tspan x="85" dy="21.25">or API client</tspan></text><rect x="350" y="255" width="260" height="130" rx="18" fill="#fff1e9" stroke="#e9bba8" stroke-width="1.5"/><text x="372" y="299" fill="#24332b" font-size="23" font-weight="600"><tspan x="372" dy="0">FastAPI  /api/v1</tspan></text><text x="372" y="334" fill="#66736a" font-size="17" font-weight="400"><tspan x="372" dy="0">API-key authentication</tspan><tspan x="372" dy="21.25">Trusted tenant identity</tspan></text><rect x="680" y="220" width="395" height="365" rx="18" fill="#ffffff" stroke="#dce3dc" stroke-width="1.5"/><text x="704" y="262" fill="#24332b" font-size="23" font-weight="600"><tspan x="704" dy="0">Shared Python services</tspan></text><rect x="700" y="291" width="355" height="75" rx="18" fill="#f4f7f1" stroke="#dce3dc" stroke-width="1.5"/><text x="717" y="319" fill="#24332b" font-size="20" font-weight="600"><tspan x="717" dy="0">1  Ingest documents</tspan></text><text x="717" y="347" fill="#66736a" font-size="16" font-weight="400"><tspan x="717" dy="0">Validate → extract → chunk → embed</tspan></text><rect x="700" y="383" width="355" height="75" rx="18" fill="#f4f7f1" stroke="#dce3dc" stroke-width="1.5"/><text x="717" y="411" fill="#24332b" font-size="20" font-weight="600"><tspan x="717" dy="0">2  Retrieve passages</tspan></text><text x="717" y="438" fill="#66736a" font-size="15" font-weight="400"><tspan x="717" dy="0">Vector + keyword → RRF → optional rerank</tspan></text><rect x="700" y="475" width="355" height="89" rx="18" fill="#f4f7f1" stroke="#dce3dc" stroke-width="1.5"/><text x="717" y="503" fill="#24332b" font-size="20" font-weight="600"><tspan x="717" dy="0">3  Answer with evidence</tspan></text><text x="717" y="530" fill="#66736a" font-size="15" font-weight="400"><tspan x="717" dy="0">Reuse retrieval → bounded context → LLM</tspan><tspan x="717" dy="18.75">Validate source IDs + supporting quotes</tspan></text><rect x="1150" y="255" width="275" height="160" rx="18" fill="#eaf2eb" stroke="#bbcfbe" stroke-width="1.5"/><text x="1170" y="300" fill="#24332b" font-size="23" font-weight="600"><tspan x="1170" dy="0">PostgreSQL 16</tspan></text><text x="1170" y="329" fill="#66736a" font-size="16" font-weight="400"><tspan x="1170" dy="0">pgvector + full-text search</tspan><tspan x="1170" dy="20.0">Tenants · documents · chunks</tspan><tspan x="1170" dy="20.0">Vectors + source metadata</tspan><tspan x="1170" dy="20.0">Tenant filters in SQL</tspan></text><rect x="1150" y="475" width="275" height="110" rx="18" fill="#ffffff" stroke="#dce3dc" stroke-width="1.5"/><text x="1170" y="514" fill="#24332b" font-size="22" font-weight="600"><tspan x="1170" dy="0">API responses</tspan></text><text x="1170" y="542" fill="#66736a" font-size="15" font-weight="400"><tspan x="1170" dy="0">Documents · ranked passages</tspan><tspan x="1170" dy="18.75">Cited answer / abstention / error</tspan></text><rect x="680" y="655" width="395" height="105" rx="18" fill="#fff1e9" stroke="#e9bba8" stroke-width="1.5"/><text x="702" y="693" fill="#24332b" font-size="22" font-weight="600"><tspan x="702" dy="0">External AI providers</tspan></text><text x="702" y="722" fill="#66736a" font-size="16" font-weight="400"><tspan x="702" dy="0">OpenAI: embeddings + chat</tspan><tspan x="702" dy="20.0">Cohere: optional reranking</tspan></text><polyline points="280,320 350,320" fill="none" stroke="#85938a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="610,320 680,320" fill="none" stroke="#85938a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1075,335 1150,335" fill="none" stroke="#85938a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#start)"/><polyline points="1075,528 1150,528" fill="none" stroke="#85938a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="877,585 877,655" fill="none" stroke="#85938a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#start)" stroke-dasharray="7 6"/><text x="895" y="618" fill="#66736a" font-size="14" font-weight="400"><tspan x="895" dy="0">Model calls when needed</tspan></text><text x="1100" y="315" fill="#66736a" font-size="14" font-weight="400"><tspan x="1100" dy="0">SQL</tspan></text><text x="65" y="652" fill="#24332b" font-size="17" font-weight="600"><tspan x="65" dy="0">Also implemented</tspan></text><text x="65" y="687" fill="#66736a" font-size="16" font-weight="400"><tspan x="65" dy="0">Local MCP tools (stdio) reuse these services.</tspan><tspan x="65" dy="20.0">Offline evaluation measures retrieval and QA.</tspan><tspan x="65" dy="20.0">SQLAlchemy 2 + Alembic manage persistence.</tspan></text><text x="65" y="811" fill="#66736a" font-size="15" font-weight="400"><tspan x="65" dy="0">Tenant isolation is enforced in queries. Documents are untrusted data. A valid citation does not guarantee factual support.</tspan></text></g></svg>