services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eke}
      POSTGRES_DB: ${POSTGRES_DB:-eke}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eke}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-eke}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eke}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-eke}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  frontend:
    profiles: [ui]
    build: ./frontend
    environment:
      BACKEND_URL: http://api:8000
      BACKEND_API_KEY: ${FRONTEND_BACKEND_API_KEY:-}
      APP_ORIGIN: ${FRONTEND_APP_ORIGIN:-http://localhost:3000}
      DEMO_PASSWORD: ${FRONTEND_DEMO_PASSWORD:-}
      SESSION_SECRET: ${FRONTEND_SESSION_SECRET:-}
      EVALUATION_REPORT_DIR: /reports
    volumes:
      - ./evaluation/reports/local-keyword:/reports:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  postgres_data:
